spring.application.name=api-gateway
server.port=8080

# ==========================================
# EUREKA SERVICE DISCOVERY
# ==========================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# FARMORA ROUTES
# ==========================================

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Field Service
spring.cloud.gateway.server.webflux.routes[1].id=field-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://FIELD-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/fields/**

# Telemetry Service
spring.cloud.gateway.server.webflux.routes[2].id=telemetry-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TELEMETRY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/telemetry/**

# Irrigation Service
spring.cloud.gateway.server.webflux.routes[3].id=irrigation-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://IRRIGATION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/irrigation/**


spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always